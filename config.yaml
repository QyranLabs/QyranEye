# =====================================================================
#  QyranEye — настройки обработки видео с дрона.
#  Все пороги здесь, в коде чисел нет. Меняйте и перезапускайте.
#  Время везде в СЕКУНДАХ ВИДЕО (не реальных), размеры — в ПИКСЕЛЯХ
#  кадра после уменьшения (см. max_height).
# =====================================================================

# ---------- Модель ----------
model: yolo26s.pt          # YOLO26 small, только рамки людей (без точек тела).
                           # На Okutama находит 84% людей против 14% у yolo26n-pose.
                           # Без точек тела поза определяется по форме рамки.
                           # Вернуть точки тела: yolo26n-pose.pt
device: mps                # mps = видеокарта Apple Silicon; cpu — если mps не работает
conf: 0.25                 # минимальная уверенность, чтобы считать детекцию человеком

# ---------- Разрешение ----------
max_height: 1080           # если кадр больше (например 4K = 2160), уменьшаем до этой высоты.
                           # Для съёмки с 15–20 м можно поставить 2160 + включить tiles.
imgsz: 1920                # на каком размере YOLO смотрит кадр. 1920 = кадр 1080p без сжатия.
                           # (стандартные 640 сжали бы человека ещё в 3 раза)
tiles:                     # нарезка кадра на куски — для очень мелких людей
  enabled: false
  rows: 2
  cols: 2
  overlap: 0.2             # перекрытие соседних кусков (доля), чтобы человек на стыке не потерялся
  imgsz: 1280              # размер, на котором YOLO смотрит каждый кусок
  merge_ios: 0.6           # склейка дублей: если рамки перекрываются на 60% меньшей — это один человек

frame_stride: 2            # анализировать каждый 2-й кадр (30 fps -> 15 анализов/сек). Видео пишется целиком.

# ---------- Размер человека ----------
min_person_px: 16          # рамки меньше (по длинной стороне) — игнорируем: это шум
min_keypoint_px: 80        # с такого размера точкам тела можно доверять (угол туловища).
                           # На Okutama меньше 80 px точки тела почти всегда ошибочны.
keypoint_conf: 0.5         # минимальная уверенность точки тела
torso_min_frac: 0.15       # туловище короче этой доли рамки — угол ненадёжен, не используем

# ---------- Трекинг ----------
tracker: botsort           # botsort — с поправкой на движение дрона (camera_motion); bytetrack — без неё.
                           # Okutama 2.1.8/2.1.9 (дрон двигается): ByteTrack показывал 37% людей,
                           # BoT-SORT — 88% (детектор находит ~92%). ID на человека: 5 -> 3.
lost_track_s: 1.5          # сколько секунд трекер помнит потерянного человека
inherit_s: 2.0             # если рядом с пропавшим человеком за это время появился «новый» ID —
inherit_dist: 1.5          # (в пределах 1.5 его роста), считаем, что это он же, и передаём историю
inherit_size_min: 0.6      # ...но только если новая рамка по размеру похожа на него: длинная сторона
inherit_size_max: 2.0      # от 0.6 до 2.0 его прежней. При падении человек не уменьшается вдвое
                           # (под углом длина почти та же, сверху растёт до ~1.6). Защита от того,
                           # чтобы история человека не досталась сумке или стулу рядом (Okutama 1.2.10).
forget_s: 10.0             # через сколько секунд отсутствия удалять историю человека

# ---------- Нейросеть позы ----------
pose_mode: geometry        # geometry — правила по форме рамки (ниже): 0 ложных тревог FALL на 11 роликах Okutama;
                           # classifier — «лежит/не лежит» решает нейросеть: статус точнее (89% против 82%
                           # у найденных людей), но 2 ложные тревоги: сеть переключается резко, поэтому
                           # спокойное укладывание выглядит как падение, и она не видела «не людей».
                           # По умолчанию geometry, пока сеть не доработана.
pose_model: pose_cls.pt    # обучена на Okutama (tools/make_pose_crops.py + tools/train_pose.py).
                           # Лицензия данных CC BY-NC-SA: только некоммерческое использование.
pose_imgsz: 96             # размер картинки человека для сети (как при обучении)
pose_lying_min: 0.5        # вероятность «лежит» >= 0.5 -> лежит. На проверочных видео Okutama:
                           # лежащих узнано 77%, не лежащих ошибочно «лежит» 1.4%
pose_upright_max: 0.3      # <= 0.3 -> стоит/сидит; между 0.3 и 0.5 — переходная поза (MID).
                           # hybrid: форма «лежит», а сеть <= 0.3 -> не лежит (человек с сумкой)
pose_net_down_min: 0.7     # hybrid: сеть >= 0.7 -> «лежит», даже если форма рамки этого не видит
pose_net_lying_s: 1.0      # hybrid: «лежит» только по сети дольше 1 с -> LYING (никогда не FALL)
pose_not_person_min: 0.5   # hybrid: сеть «не человек» >= 0.5 -> по этой рамке выводов нет
alarm_net_share: 0.5       # hybrid: тревога, если сеть говорила «лежит» хотя бы в 50% кадров ожидания
                           # (пороги hybrid выбраны на проверочных видео обучающей части Okutama)

# ---------- Ракурс камеры ----------
# Стоящий человек выглядит по-разному: под углом — узкая высокая рамка,
# строго сверху — компактное пятно (голова и плечи). Поэтому поза определяется
# по-разному для двух ракурсов.
camera_view: auto          # auto | oblique (под углом, 45–60°) | nadir (строго вниз, ~90°)
camera_view_default: oblique  # что выбрать в auto, если людей в начале видео слишком мало
view_prescan: true         # auto: сначала просмотреть начало видео и определить ракурс,
                           # потом обрабатывать с первого кадра (без «?» в первые секунды)
camera_motion: sparseOptFlow  # поправка на движение дрона по фону (оптический поток): sparseOptFlow | none.
                              # Один и тот же сдвиг использует трекер и правило «не перемещается».
view_auto_s: 5.0           # auto: решаем через 5 с после появления первого человека.
                           # Каждый человек голосует ОДИН раз (своей медианой ширина/высота),
                           # чтобы один кадр с сумками и скамейками не перевесил.
view_min_tracks: 3         # нужно хотя бы 3 человека (у каждого >= 3 замеров)...
view_max_wait_s: 15.0      # ...если их нет, ждём до 15 с и решаем по тем, кто есть
view_nadir_min_wh: 0.75    # медиана голосов >= 0.75 -> «сверху».
                           # Okutama (7 роликов): под углом 0.52–0.66, сверху 1.01–1.10.
                           # Раньше решали по первым 20 рамкам — в ролике 1.2.3 это дало ошибку.
                           # Первые 5 с видео (пока ракурс не ясен) система выводов не делает.

# ---------- «Вертикально / горизонтально»: съёмка ПОД УГЛОМ ----------
# Признак 1 (главный): угол туловища (бёдра -> плечи) к вертикали кадра.
torso_upright_max_deg: 30  # до 30° — стоит
torso_lying_min_deg: 60    # от 60° — лежит; между — переходная поза (MID)
# Признак 2 (если точек тела нет): форма рамки по сравнению с ЭТИМ ЖЕ человеком, пока он стоял.
aspect_up_factor: 1.3      # ширина/высота выросла меньше чем в 1.3 раза — стоит
aspect_down_factor: 1.8    # выросла в 1.8 раза и больше — лежит
baseline_window_s: 2.0     # эталон «как он выглядит стоя» = медиана за последние 2 с стояния.
                           # В эталон попадают только кадры, где рамка и сама по себе похожа на
                           # стоящего (под углом w/h <= aspect_abs_upright_max, сверху вытянутость
                           # < nadir_elong_upright_max), иначе эталон медленно «уползает» (Okutama 1.2.10).
# Признак 3 (запасной, пока эталона ещё нет): абсолютное отношение ширина/высота рамки.
aspect_abs_upright_max: 0.8
aspect_abs_lying_min: 1.5

# ---------- «Вертикально / горизонтально»: съёмка СВЕРХУ ----------
# Сверху важно не «шире или выше», а насколько рамка вытянута в любом направлении
# (длинная сторона / короткая) и насколько она стала длиннее, чем у него же стоя.
# Okutama 2.2.10: стоит — вытянутость 1.3, длина 58 px; лежит — 2.05 и 91 px.
nadir_elong_upright_max: 1.5   # вытянутость меньше 1.5 — стоит (или сидит)
nadir_elong_lying_min: 1.8     # 1.8 и больше — лежит...
nadir_size_factor: 1.4         # ...и длинная сторона выросла в 1.4 раза по сравнению с ним же стоя
                               # (пока эталона нет, решает только вытянутость)

vote_window_s: 0.5         # сглаживание: решение по большинству голосов за 0.5 с

# ---------- Логика падения ----------
alarm_down_share: 0.7      # тревога, только если за время ожидания (lying_alarm_s) человек
                           # «лежал» хотя бы в 70% кадров и лежит в момент тревоги; если меньше — отмена.
still_window_s: 2.0        # скорость человека считается по смещению за 2 с (с поправкой на дрон)
still_speed_max: 0.5       # тревога отменяется, если медиана скорости за время ожидания больше
                           # 0.5 длины тела в секунду: лежащий не перемещается (несут сумку, человек идёт).
                           # Okutama: лежит — медиана 0.10, идёт — 0.77. Для LYING не используется:
                           # у лежащих длинный «хвост» (33% кадров > 0.4) из-за дрожания рамок.
edge_margin_px: 2          # рамка ближе к краю кадра — обрезана, позу по ней не определяем

fall_transition_s: 0.75    # время от последнего кадра «стоит» (<30°) до первого «лежит» (>60°).
                           # Это прохождение только средней части поворота (30° из ~80°, около 3/8),
                           # поэтому 0.75 с соответствует повороту туловища целиком примерно за 2 с.
                           # Быстрее -> падение; медленнее -> человек лёг сам (LYING, без тревоги).
lying_alarm_s: 5.0         # после падения лежит дольше 5 с -> ТРЕВОГА FALL
recover_s: 2.0             # снова стоит 2 с подряд -> тревога снимается

# ---------- Вывод ----------
output_dir: results        # куда сохранять видео и CSV (относительно папки проекта)
draw_keypoints: true       # рисовать линию туловища
show_preview: false        # показывать окно во время обработки (q — остановить)
