# =====================================================================
#  QyranEye — то же, что config.yaml, но кадр режется на куски (tiles):
#  для очень мелких людей (съёмка с 15–20 м). Здесь только ОТЛИЧИЯ,
#  все остальные пороги и комментарии к ним — в config.yaml.
#
#      .venv/bin/python main.py видео.mp4 --config config_tiles.yaml
# =====================================================================
base: config.yaml

tiles:
  enabled: true            # 2×2 куска с перекрытием (размеры кусков — в config.yaml, раздел tiles)

output_dir: results_tiles  # отдельная папка, чтобы не перезаписать результаты config.yaml
